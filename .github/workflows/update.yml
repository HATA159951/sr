name: Update Sreality prices

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sreality-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests openpyxl

      - name: Update workbook from Sreality
        run: python scrape_sreality.py

      - name: Commit and push workbook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SREALITY.xlsx
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update Sreality prices and views"
            git push
          fi
